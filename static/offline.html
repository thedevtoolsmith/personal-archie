<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline | Surya Kanagasabapathi</title>
  <meta name="theme-color" content="#232333">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f5;
      --fg: #232333;
      --accent: #ff0000d6;
      --muted: #5c5c72;
      --card: rgba(255, 255, 255, 0.82);
      --border: rgba(35, 35, 51, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #282a36;
        --fg: #f6f6f8;
        --accent: #bd93f9;
        --muted: #d1d1dc;
        --card: rgba(24, 24, 32, 0.72);
        --border: rgba(255, 255, 255, 0.08);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(255, 0, 0, 0.08), transparent 40%),
        var(--bg);
      color: var(--fg);
      font: 16px/1.6 "Berkley Mono", "SFMono-Regular", ui-monospace, monospace;
    }

    main {
      width: min(100%, 640px);
      padding: 32px 28px;
      border: 1px solid var(--border);
      background: var(--card);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.35rem;
    }

    h1::before {
      content: "# ";
      color: var(--accent);
    }

    p {
      margin: 0 0 16px;
    }

    .muted {
      color: var(--muted);
    }

    a {
      color: inherit;
      text-decoration: none;
      border-bottom: 3px solid var(--accent);
    }

    a:hover {
      background: var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>The site shell is available, but this page could not be refreshed from the network.</p>
    <p class="muted">Reconnect and retry, or go back to the <a href="/">homepage</a>.</p>
  </main>
</body>
</html>
